    L.path = el('path', { 'class': 'core', d: d, stroke: 'var(--l-' + L.id + ')' }, g);
    var s0 = L.path.getPointAtLength(0);
    el('circle', { cx: s0.x, cy: s0.y, r: 4.5, stroke: 'var(--l-' + L.id + ')' }, g);
    L.g = g;
    L.len = L.path.getTotalLength();
    L.label = L.labelPos ? text(gLabels, L.labelPos[0], L.labelPos[1], L.name, 'ln', 11, L.labelPos[2]) : el('g', {}, gLabels);
  });

  // Stations: a capsule across the lines that exist at that role; labels in one row below.
  ROLES.forEach(function (r) {
    var lanes = LINES.filter(function (L) { return roleById[L.at].i <= r.i; }).map(function (L) { return L.lane; });
    var y1 = laneY(Math.min.apply(null, lanes)) - 9, y2 = laneY(Math.max.apply(null, lanes)) + 9;
    var g = el('g', { 'class': 'station', 'data-id': r.id }, gStations);
    el('rect', { x: r.x - 7, y: y1, width: 14, height: y2 - y1, rx: 7 }, g);
    r.node = g;
    r.leader = el('line', { 'class': 'leader st-label', x1: r.x, y1: y2, x2: r.x, y2: laneY(7) + 44 }, gLabels);
    r.label = text(gLabels, r.x, laneY(7) + 62, r.label, 'st-label', 11, 'middle');
  });

  // Terminal: executive decisions
  var term = el('g', { 'class': 'terminal' }, gStations);
  var pulse = el('circle', { 'class': 'pulse', cx: XT, cy: CY, r: 28 }, term);
  el('circle', { 'class': 'ring', cx: XT, cy: CY, r: 28 }, term);
  el('circle', { 'class': 'core', cx: XT, cy: CY, r: 10 }, term);
  text(gLabels, XT, CY + 62, 'EXECUTIVE\nDECISIONS', 'strong', 11, 'middle');

  // Particles: events moving through each line toward the terminal
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var parts = [];
  LINES.forEach(function (L, i) {
    var n = Math.max(2, Math.round(L.len / 160));
    for (var k = 0; k < n; k++) {
      parts.push({ L: L, o: (k / n + i * 0.137) % 1, c: el('circle', { r: 3.2, fill: 'var(--bg)', stroke: 'var(--l-' + L.id + ')', 'stroke-width': 1.3 }, L.g) });
    }
  });
  var SPEED = 45; // units per second
  function tick(ts) {
    parts.forEach(function (p) {
      var f = (p.o + ts / 1000 * SPEED / p.L.len) % 1;
      var pt = p.L.path.getPointAtLength(f * p.L.len);
      p.c.setAttribute('cx', pt.x); p.c.setAttribute('cy', pt.y);
    });
    var ph = (ts / 2400) % 1;
    pulse.setAttribute('r', 28 + ph * 28); pulse.style.opacity = (1 - ph) * .5;
    if (!reduce) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- camera ----------
  // Fits a world-space box into the free screen area right of the text panel.
  var svg = document.getElementById('svg');
  function toSvg(px, py) { var p = svg.createSVGPoint(); p.x = px; p.y = py; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function camera(id) {
    var W = window.innerWidth, H = window.innerHeight, mobile = W <= 900;
    var rect = svg.getBoundingClientRect();
    var area = mobile ? { l: 16, r: rect.width - 16, t: 40, b: rect.height - 16 } : { l: Math.max(560, W * 0.45), r: W - 50, t: 100, b: H - 120 };
    var box;
    if (id) {
      var r = roleById[id], a = r.i === 0 ? -110 : r.x - G * 0.9, b = r.i === ROLES.length - 1 ? XT + 70 : r.x + G * 1.6;
      box = { x0: a, x1: b, y0: laneY(0) - 46 - 3 * 44 - 30, y1: laneY(7) + 100 };
    } else {
      box = { x0: -110, x1: XT + 50, y0: laneY(0) - 46 - 3 * 44 - 30, y1: laneY(7) + 100 };
    }
    var p0 = toSvg(rect.left + area.l, rect.top + area.t), p1 = toSvg(rect.left + area.r, rect.top + area.b);
    var k = Math.min((p1.x - p0.x) / (box.x1 - box.x0), (p1.y - p0.y) / (box.y1 - box.y0), 2.2);
    var cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
    var fx = (p0.x + p1.x) / 2, fy = (p0.y + p1.y) / 2;
    world.style.transform = 'translate(' + (fx - k * cx) + 'px,' + (fy - k * cy) + 'px) scale(' + k + ')';
    var s = Math.max(rect.width / 1600, rect.height / 1000) * k;
    scaled.forEach(function (e) { e[0].style.fontSize = (e[1] / s) + 'px'; });
  }

  // ---------- chapters ----------
  var panel = document.getElementById('panel'), nav = document.getElementById('chapters');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  CH.forEach(function (c, i) {
    var a = document.createElement('article');
    a.hidden = true;
    var html = '<div class="kicker"><span class="idx">' + pad(i) + '</span>' + c.kicker + '</div>';
    html += c.h1 ? '<h1>' + c.h1 + '</h1>' : '<h2>' + c.h2 + '</h2>';
    if (c.meta) html += '<div class="role-meta">' + c.meta + '</div>';
    if (c.lead) html += '<p class="lead">' + c.lead + '</p>';
    if (c.figs) html += '<div class="figs">' + c.figs.map(function (f) {
      return '<div class="fig"><div class="n">' + f[0] + (f[1] ? '<small>' + f[1] + '</small>' : '') + '</div><div class="l">' + f[2] + '</div></div>';
    }).join('') + '</div>';
    if (c.cmp) {
      var max = Math.max.apply(null, c.cmp.rows.map(function (r) { return r[1]; }));
      html += '<div class="cmp"><div class="cmp-title">' + c.cmp.title + '</div>' + c.cmp.rows.map(function (r, j) {
        var w = (r[1] / max * 78).toFixed(2);
        return '<div class="cmp-row' + (j ? ' hi' : '') + '"><span>' + r[0] + '</span><div class="rail"><div class="fill" data-w="' + w + '"></div><span class="val" data-w="' + w + '" style="left:0">' + r[2] + '</span></div></div>';
      }).join('') + '</div>';
    }
    var added = c.focus ? LINES.filter(function (L) { return L.at === c.focus; }) : (c.allLines ? LINES.slice().reverse() : []);
    if (added.length) {
      html += '<div class="chips"><div class="chips-title">' + (c.focus ? 'Added to the stack here' : 'Capabilities on the map') + '</div>' +
        added.map(function (L) { return '<div class="chip"><i style="background:var(--l-' + L.id + ')"></i>' + L.name + '</div>'; }).join('') + '</div>';
    }
    if (c.points) html += '<ul class="points">' + c.points.map(function (p) { return '<li><b>' + p[0] + '</b>' + p[1] + '</li>'; }).join('') + '</ul>';
    if (c.hint) html += '<p class="hint">' + c.hint + '</p>';
    a.innerHTML = html;
    panel.appendChild(a);
    c.article = a;

    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = pad(i) + ' ' + c.nav;
    b.addEventListener('click', function () { stop(); go(i); });
    nav.appendChild(b);
    c.btn = b;
  });

  var cur = -1;
  function go(i) {
    i = (i + CH.length) % CH.length;
    if (i === cur) return;
    if (cur >= 0) { CH[cur].article.hidden = true; CH[cur].btn.removeAttribute('aria-current'); }
    cur = i;
    var c = CH[i];
    c.article.hidden = false;
    c.btn.setAttribute('aria-current', 'step');
    c.btn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    panel.scrollTop = 0;
    var role = c.focus ? roleById[c.focus] : null;
    ROLES.forEach(function (r) {
      var on = r === role;
      r.node.classList.toggle('on', on);
      r.label.classList.toggle('strong', on);
    });
    LINES.forEach(function (L) {
      var future = role && roleById[L.at].i > role.i;
      var past = role && !future && L.at !== role.id;
      L.g.classList.toggle('future', !!future);
      L.g.classList.toggle('past', !!past);
      L.label.style.opacity = future ? .15 : (past ? .55 : 1);
      L.label.classList.toggle('strong', !!role && L.at === role.id);
    });
    gLabels.classList.toggle('hide-stations', c.stations === false);
    gLabels.classList.toggle('dimmed', !!role);
    camera(c.focus);
    requestAnimationFrame(function () {
      c.article.querySelectorAll('.fill').forEach(function (f) { f.style.width = '0'; });
      c.article.querySelectorAll('.val').forEach(function (v) { v.style.left = '0'; });
      requestAnimationFrame(function () {
        c.article.querySelectorAll('.fill').forEach(function (f) { f.style.width = f.dataset.w + '%'; });
        c.article.querySelectorAll('.val').forEach(function (v) { v.style.left = v.dataset.w + '%'; });
      });
    });
    if (history.replaceState) history.replaceState(null, '', '#' + pad(i));
  }

  ROLES.forEach(function (r) {
    r.node.addEventListener('click', function () {
      var i = CH.findIndex(function (c) { return c.focus === r.id; });
      if (i >= 0) { stop(); go(i); }
    });
  });

  // ---------- controls ----------
  var timer = null, playBtn = document.getElementById('play');
  function stop() { clearInterval(timer); timer = null; playBtn.setAttribute('aria-pressed', 'false'); playBtn.textContent = 'Autoplay'; }
  playBtn.addEventListener('click', function () {
    if (timer) return stop();
    playBtn.setAttribute('aria-pressed', 'true'); playBtn.textContent = 'Pause';
    timer = setInterval(function () { go(cur + 1); }, 6000);
  });
  document.getElementById('prev').addEventListener('click', function () { stop(); go(cur - 1); });
  document.getElementById('next').addEventListener('click', function () { stop(); go(cur + 1); });
  var root = document.documentElement;
  var saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  document.getElementById('theme').addEventListener('click', function () {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  });
  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (root.requestFullscreen) root.requestFullscreen();
  }
  document.getElementById('full').addEventListener('click', fullscreen);
  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); stop(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); stop(); go(cur - 1); }
    else if (e.key === 'f' || e.key === 'F') fullscreen();
    else if (e.key === 'Home') { stop(); go(0); }
  });
  window.addEventListener('resize', function () { camera(CH[cur].focus); });

  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start);
})();
</script>
</body>
</html>
